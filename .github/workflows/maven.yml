# Run mvn test to ensure all tests pass

name: Java CI with Maven

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: zulu
    - name: Run unit tests
      run: mvn test

  message-encoding:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # JDK 17 is covered by the build job. This job is here for Java 8.
        os: [ubuntu-latest, windows-latest]
        java: [8]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up test JDK
      id: test-java
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
    - name: Set up build JDK
      uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: zulu
    - name: Test message encoding
      shell: bash
      env:
        TEST_JAVA_HOME: ${{ steps.test-java.outputs.path }}
      run: |
        test_java="$TEST_JAVA_HOME/bin/java"
        if [ -f "$test_java.exe" ]; then
          test_java="$test_java.exe"
        fi
        mvn -B -ntp -Dtest=MessageBundleTest "-Djvm=$test_java" test
